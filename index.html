<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vesting Maastricht – Historische Perioden</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Nunito:wght@400;600;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #0a0e14 0%, #0d1520 50%, #0a0e14 100%);
    display: flex;
    flex-direction: row;
    align-items: stretch;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
    gap: 32px;
    padding: 16px;
  }

  .left {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    flex-shrink: 0;
  }

  h1 {
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 2.5vw, 15px);
    color: #64c8f0;
    letter-spacing: 3px;
    text-align: center;
    text-transform: uppercase;
    opacity: 1;
  }

  .pointer {
    width: 0; height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid #2196c8;
    filter: drop-shadow(0 4px 14px rgba(33,150,200,0.7));
    margin-bottom: -14px;
    z-index: 10;
  }

  .container {
    position: relative;
    width: min(480px, calc(100vh - 200px), calc(100vw - 360px));
    height: min(480px, calc(100vh - 200px), calc(100vw - 360px));
    cursor: pointer;
    flex-shrink: 0;
  }

  svg.wheel {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 8px 40px rgba(0,0,0,0.6));
    transform-origin: center center;
  }

  .slice { cursor: pointer; }

  .period-emoji {
    position: absolute;
    pointer-events: none;
    line-height: 1;
    user-select: none;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }

  .btn {
    padding: 11px 28px;
    background: linear-gradient(135deg, #1578a8, #2196c8);
    color: #ffffff;
    border: none;
    border-radius: 50px;
    font-family: 'Cinzel', serif;
    font-size: clamp(12px, 3vw, 15px);
    font-weight: 700;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(33,150,200,0.4);
    transition: all 0.2s;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .btn:hover { transform: scale(1.04); box-shadow: 0 6px 24px rgba(33,150,200,0.6); }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { background: #555; color: #999; cursor: not-allowed; transform: none; box-shadow: none; }

  /* Info panel */
  .info-panel {
    width: 290px;
    min-width: 240px;
    max-width: 340px;
    background: linear-gradient(180deg, #0d1117 0%, #111825 100%);
    border: 1px solid rgba(33,150,200,0.3);
    border-radius: 20px;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 1;
  }

  .info-panel.empty {
    align-items: center;
    justify-content: center;
    color: rgba(140,210,240,0.95);
    font-size: 14px;
    text-align: center;
    padding: 24px;
    gap: 14px;
    font-family: 'Cinzel', serif;
  }

  /* ── MOBILE: stack vertically ── */
  @media (max-width: 700px) {
    body {
      flex-direction: column;
      align-items: center;
      height: auto;
      min-height: 100vh;
      overflow-y: auto;
      padding: 16px 12px 24px;
      gap: 16px;
    }
    .container {
      width: min(88vw, calc(45vh - 40px));
      height: min(88vw, calc(45vh - 40px));
    }
    .info-panel {
      width: 100%;
      max-width: 480px;
      height: auto;
      max-height: 55vh;
      min-height: 200px;
    }
    .info-panel.empty {
      min-height: 160px;
      padding: 20px;
    }
    h1 { font-size: 13px; letter-spacing: 2px; }
  }

  @media (max-width: 400px) {
    .container {
      width: min(92vw, calc(45vh - 40px));
      height: min(92vw, calc(45vh - 40px));
    }
    .btn { font-size: 12px; padding: 10px 22px; }
  }

  .panel-header {
    padding: 20px 20px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid rgba(255,255,255,0.08);
  }

  .period-badge {
    display: inline-block;
    background: rgba(255,255,255,0.12);
    color: rgba(255,255,255,0.7);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }

  .category-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
  }

  .cat-icon {
    font-size: 30px;
    line-height: 1;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }

  .cat-name {
    font-family: 'Cinzel', serif;
    font-size: 14px;
    font-weight: 700;
    color: #2196c8;
    line-height: 1.3;
  }

  .cat-years {
    font-size: 11px;
    color: rgba(33,150,200,0.65);
    font-style: italic;
  }

  .cat-desc {
    font-size: 12px;
    color: rgba(255,255,255,0.7);
    line-height: 1.65;
  }

  .panel-body {
    flex: 1;
    overflow-y: auto;
    padding: 14px 16px 16px;
    scrollbar-width: thin;
    scrollbar-color: rgba(33,150,200,0.35) transparent;
  }
  .panel-body::-webkit-scrollbar { width: 4px; }
  .panel-body::-webkit-scrollbar-thumb { background: rgba(33,150,200,0.35); border-radius: 2px; }

  .facts-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(33,150,200,0.6);
    margin-bottom: 10px;
  }

  .fact-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    padding: 7px 10px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 6px;
    border-left: 2px solid;
    transition: background 0.15s;
  }
  .fact-item:hover { background: rgba(255,255,255,0.07); }

  .fact-emoji {
    font-size: 16px;
    line-height: 1.3;
    flex-shrink: 0;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }

  .fact-text {
    font-size: 11.5px;
    color: rgba(255,255,255,0.8);
    line-height: 1.5;
  }

  .fact-text strong {
    color: #2196c8;
    font-weight: 700;
  }

  .persons-title {
    font-family: 'Cinzel', serif;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: rgba(33,150,200,0.6);
    margin: 12px 0 8px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.07);
  }
  .person-card {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    background: rgba(33,150,200,0.07);
    border-radius: 10px;
    margin-bottom: 7px;
    border-left: 2px solid rgba(33,150,200,0.5);
    transition: background 0.15s;
  }
  .person-card:hover { background: rgba(33,150,200,0.13); }
  .person-avatar {
    font-size: 22px;
    line-height: 1.2;
    flex-shrink: 0;
    font-family: "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  }
  .person-info { flex: 1; }
  .person-name {
    font-family: 'Cinzel', serif;
    font-size: 11px;
    font-weight: 700;
    color: #64c8f0;
    margin-bottom: 2px;
  }
  .person-role {
    font-size: 10px;
    color: rgba(255,255,255,0.55);
    font-style: italic;
    margin-bottom: 3px;
  }
  .person-desc {
    font-size: 11px;
    color: rgba(255,255,255,0.75);
    line-height: 1.5;
  }
  .tooltip {
    position: fixed;
    background: rgba(8,14,24,0.96);
    color: #2196c8;
    border: 1px solid rgba(33,150,200,0.35);
    padding: 7px 14px;
    border-radius: 8px;
    font-size: 12px;
    font-family: 'Cinzel', serif;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.15s;
    z-index: 99;
    white-space: nowrap;
  }
  .tooltip.visible { opacity: 1; }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(40px); }
    to   { opacity: 1; transform: translateX(0); }
  }
  @media (max-width: 700px) {
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  }
  .slide-in { animation: slideIn 0.45s cubic-bezier(0.22,1,0.36,1) both; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div class="left">
  <h1>Vestingmuseum Maastricht</h1>
  <p style="font-family:'Nunito',sans-serif;font-size:11px;color:rgba(140,210,240,0.9);letter-spacing:2px;text-align:center;margin-top:-14px;text-transform:uppercase;">De Vesting door de Eeuwen</p>
  <div class="pointer"></div>
  <div class="container" id="wheel-container">
    <svg class="wheel" id="wheel-svg" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Periode 1: Romeins (rood-bruin) -->
        <linearGradient id="gRomein" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#c0392b"/>
          <stop offset="100%" stop-color="#7b2318"/>
        </linearGradient>
        <!-- Periode 2: Vroeg Middeleeuws (donker paars) -->
        <linearGradient id="gVroegMiddel" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#6c3483"/>
          <stop offset="100%" stop-color="#4a2357"/>
        </linearGradient>
        <!-- Periode 3: Middeleeuws (steen-grijs blauw) -->
        <linearGradient id="gMiddel" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2471a3"/>
          <stop offset="100%" stop-color="#1a4f72"/>
        </linearGradient>
        <!-- Periode 4: Spaans/Bourgondisch (donker goud) -->
        <linearGradient id="gSpaans" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d4ac0d"/>
          <stop offset="100%" stop-color="#9a7d0a"/>
        </linearGradient>
        <!-- Periode 5: Republiek/Barok (groen) -->
        <linearGradient id="gRepubliek" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#1e8449"/>
          <stop offset="100%" stop-color="#145a32"/>
        </linearGradient>
        <!-- Periode 6: Frans/Opheffing (grijs) -->
        <linearGradient id="gFrans" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#717d7e"/>
          <stop offset="100%" stop-color="#4d5656"/>
        </linearGradient>

        <clipPath id="circleClip">
          <circle cx="250" cy="250" r="238"/>
        </clipPath>

        <!-- Subtle texture overlay -->
        <filter id="texture">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
          <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
          <feBlend in="SourceGraphic" in2="grayNoise" mode="multiply" result="blend"/>
          <feComposite in="blend" in2="SourceGraphic" operator="in"/>
        </filter>
      </defs>

      <g clip-path="url(#circleClip)">
        <!-- Background circle -->
        <circle cx="250" cy="250" r="238" fill="#1a1208"/>

        <!-- 6 perioden – gelijke segmenten van elk 60° -->
        <!-- Periode 1: Romeins 0°→80° -->
        <g class="slice" data-label="Romeinse Tijd">
          <path d="M250,250 L250,12 A238,238 0 0,1 459,369 Z" fill="url(#gRomein)" opacity="0.92"/>
        </g>
        <!-- Periode 2: Vroeg Middeleeuws 80°→160° -->
        <g class="slice" data-label="Vroege Middeleeuwen">
          <path d="M250,250 L459,369 A238,238 0 0,1 41,369 Z" fill="url(#gVroegMiddel)" opacity="0.92"/>
        </g>
        <!-- Periode 3: Middeleeuws 160°→240° -->
        <g class="slice" data-label="Middeleeuwen – Stadsmuren">
          <path d="M250,250 L41,369 A238,238 0 0,1 131,12 Z" fill="url(#gMiddel)" opacity="0.92"/>
        </g>
        <!-- Periode 4: Spaans/Bourgondisch 240°→300° -->
        <g class="slice" data-label="Bourgondisch &amp; Spaans Bestuur">
          <path d="M250,250 L131,12 A238,238 0 0,1 250,12 Z" fill="url(#gSpaans)" opacity="0.92"/>
        </g>

        <!-- Divider lines -->
        <g stroke="rgba(212,168,67,0.5)" stroke-width="2" >
          <line x1="250" y1="250" x2="250" y2="12"/>
          <line x1="250" y1="250" x2="459" y2="369"/>
          <line x1="250" y1="250" x2="41"  y2="369"/>
          <line x1="250" y1="250" x2="131" y2="12"/>
        </g>
      </g>

      <!-- Outer ring -->
      <circle cx="250" cy="250" r="238" fill="none" stroke="rgba(33,150,200,0.7)" stroke-width="4"/>
      <circle cx="250" cy="250" r="234" fill="none" stroke="rgba(33,150,200,0.2)" stroke-width="2"/>

      <!-- Center with logo -->
      <circle cx="250" cy="250" r="84" fill="#0a0e14"/>
      <circle cx="250" cy="250" r="84" fill="none" stroke="rgba(33,150,200,0.6)" stroke-width="2.5"/>

  // Let me just define 4 equal-ish slices by correcting the paths

  // For the final version let me just use what I've drawn and hardcode the angles:
  // Visual inspection of paths:

          </div>`).join('')}
        ${data.persons ? `
        <div class="persons-title">👤 Sleutelfiguren</div>
        ${data.persons.map(p => `
          <div class="person-card">
            <span class="person-avatar">${p.emoji}</span>
            <div class="person-info">
              <div class="person-name">${p.name}</div>
              <div class="person-role">${p.role}</div>
              <div class="person-desc">${p.desc}</div>
            </div>
          </div>`).join('')}` : ''}
      </div>
    `;
  }

  const btn = document.getElementById('spinBtn');
  btn.addEventListener('click', () => {
    if (spinning) {
      spinning = false;
      if (rafId) cancelAnimationFrame(rafId);
      btn.disabled = true;
      const key = getSliceAtPointer(currentAngle);
      showInfo(key);
      setTimeout(() => {
        btn.textContent = '⚔ Draai door de geschiedenis';
        btn.disabled = false;
      }, 600);
      return;
    }
    spinning = true;
    document.getElementById('info-panel').className = 'info-panel empty';
    document.getElementById('info-panel').innerHTML = '<span style="font-size:38px">⚔️</span><p>Door de eeuwen heen...</p>';
    btn.textContent = '🛑 Stop!';
    const speed = 1 + Math.random() * 1;
    function animate() {
      if (!spinning) return;
      currentAngle += speed;
      applyRotation(currentAngle);
      rafId = requestAnimationFrame(animate);
    }
    rafId = requestAnimationFrame(animate);
  });

  applyRotation(0);

  // Re-render emoji positions on resize / orientation change
  window.addEventListener('resize', () => applyRotation(currentAngle));


  const tooltip = document.getElementById('tooltip');
  document.querySelectorAll('.slice').forEach(slice => {
    slice.addEventListener('mouseenter', () => {
      if (spinning) return;
      tooltip.textContent = slice.dataset.label;
      tooltip.classList.add('visible');
    });
    slice.addEventListener('mousemove', e => {
      tooltip.style.left = (e.clientX+14)+'px';
      tooltip.style.top  = (e.clientY-30)+'px';
    });
    slice.addEventListener('mouseleave', () => tooltip.classList.remove('visible'));
  });
</script>
</body>
</html>
